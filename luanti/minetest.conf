# Server-Konfiguration – wird von setup.sh nach data/main-config/minetest.conf kopiert.
# Nach Änderungen dort:  docker compose restart

# --- Allgemein ---
server_name = Familien-Server
server_description = VoxeLibre im Heimnetz
motd = Willkommen! Viel Spass beim Bauen.
# Nicht in der öffentlichen Serverliste anzeigen
server_announce = false
max_users = 10

# Admin-Spieler: dieser Name bekommt automatisch alle Rechte.
# Beim ersten Login mit diesem Namen ein Passwort setzen!
name = admin

# --- Spiel ---
default_game = mineclone2
# false = Kreativmodus aus (Survival). Auf true setzen für Kreativmodus.
creative_mode = false
enable_damage = true
enable_pvp = false
# v6 wird von VoxeLibre nicht unterstützt
mg_name = v7

# --- Zugang ---
# Neue Spieler müssen ein Passwort setzen
disallow_empty_password = true
default_privs = interact, shout
# Optional: Neue Spieler dürfen erst bauen, wenn der Admin es erlaubt
# (im Chat: /grant <spieler> interact)
# default_privs = shout

# --- Performance (für kleine Server / Raspberry Pi ggf. reduzieren) ---
max_block_send_distance = 10
max_block_generate_distance = 10
active_block_range = 3

# --- Netzwerk ---
# Docker-Netze haben meist kein IPv6 – daher nur IPv4 binden
ipv6_server = false
bind_address = 0.0.0.0
